name: Android APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Prepare production keystore
        env:
          NETSCOPE_KEYSTORE_BASE64: ${{ secrets.NETSCOPE_KEYSTORE_BASE64 }}
        run: |
          test -n "$NETSCOPE_KEYSTORE_BASE64"
          printf '%s' "$NETSCOPE_KEYSTORE_BASE64" | base64 --decode > android/netscope-release.jks
          test -s android/netscope-release.jks

      - name: Build signed ARM APKs
        env:
          NETSCOPE_KEYSTORE_PATH: ${{ github.workspace }}/android/netscope-release.jks
          NETSCOPE_KEYSTORE_PASSWORD: ${{ secrets.NETSCOPE_KEYSTORE_PASSWORD }}
          NETSCOPE_KEY_ALIAS: ${{ secrets.NETSCOPE_KEY_ALIAS }}
        run: flutter build apk --release --split-per-abi

      - name: Remove temporary keystore
        if: always()
        run: rm -f android/netscope-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: NetScope-android-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
