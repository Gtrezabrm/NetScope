plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "11"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

def releaseKeystorePath = System.getenv("NETSCOPE_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("NETSCOPE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NETSCOPE_KEY_ALIAS")

def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias

android {
    namespace "com.netscope.app"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.netscope.app"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            if (!hasReleaseSigning) {
                throw new GradleException("Production signing is not configured. Set NETSCOPE_KEYSTORE_PATH, NETSCOPE_KEYSTORE_PASSWORD, and NETSCOPE_KEY_ALIAS.")
            }
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}
